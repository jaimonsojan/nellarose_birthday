</style></head><body><main class="app" id="app"><header class="header"><div class="avatar"><img id="avatar" src="baby.jpg" alt="Nella Rose"></div><div><div class="user">nella.rose ♡</div><div class="sub">First birthday invitation · 30 October</div></div><span class="more">···</span></header><section class="visual" id="visual" aria-label="Birthday photo carousel"><div class="track" id="track"></div><span class="counter" id="counter">1/1</span><button class="nav prev" id="prev" aria-label="Previous photo">‹</button><button class="nav next" id="next" aria-label="Next photo">›</button></section><div class="actions"><button class="action" id="like" aria-label="Like"><svg viewBox="0 0 24 24"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1.1-1.1a5.5 5.5 0 0 0-7.8 7.8L12 21l8.8-8.6a5.5 5.5 0 0 0 0-7.8Z"/></svg></button><button class="action" id="comment" aria-label="Comment"><svg viewBox="0 0 24 24"><path d="M21 11.5a8.5 8.5 0 0 1-8.5 8.5 9 9 0 0 1-4-.9L3 21l1.9-5.5a8.5 8.5 0 1 1 16.1-4Z"/></svg></button><button class="action" id="share" aria-label="Share"><svg viewBox="0 0 24 24"><path d="m22 2-7 20-4-9-9-4 20-7ZM22 2 11 13"/></svg></button><div class="dots" id="dots"></div><button class="action save" id="save" aria-label="Save"><svg viewBox="0 0 24 24"><path d="M5 3h14v18l-7-5-7 5V3Z"/></svg></button></div><div class="likes" id="likes">Loved by family & friends ♡</div><div class="caption"><b>nella.rose</b> Our little sunshine is turning ONE! 🎂✨ You're invited to celebrate Nella Rose's first birthday. 💗<div class="muted">Friday, 30 Oct 2026 · 7:00 PM · Calicut Notebook</div></div><audio id="audio" loop preload="none"></audio></main><script>

const AVATAR_URL = PHOTO_URLS[0] || "baby.jpg";
let photos=PHOTO_URLS.slice(0,10),current=0;const escapeHtml=s=>s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function render(){if(!photos.length)photos=["baby.jpg"];const slides=photos.map((src,i)=>`<div class="slide"><img src="${escapeHtml(src)}" alt="Nella Rose birthday photo ${i+1}"><span class="spark a">✦</span><span class="spark b">✧</span><span class="spark c">♡</span>${i===0?`<div class="copy"><div><div class="eyebrow">YOU'RE INVITED TO</div><div class="name">Nella Rose</div><div class="subtitle">FIRST BIRTHDAY ♡</div></div><div><div class="bottom">30 October 2026</div><div class="small">FRIDAY · 07:00 PM</div><div class="venue">Calicut Notebook</div><div class="small">COME CELEBRATE ONE YEAR OF LOVE</div></div></div>`:`<div class="copy"><div><div class="eyebrow">OUR LITTLE SUNSHINE</div><div class="name">Nella Rose</div><div class="subtitle">TURNS ONE ♡</div></div><div><div class="small">30 OCT 2026 · 07:00 PM</div><div class="venue">Calicut Notebook</div></div></div>`}</div>`).join('');$('track').innerHTML=slides;$('dots').innerHTML=photos.map((_,i)=>`<span class="dot ${i===current?'active':''}"></span>`).join('');update();}function update(){current=Math.max(0,Math.min(current,photos.length-1));$('track').style.transform=`translateX(-${current*100}%)`;$('counter').textContent=`${current+1}/${photos.length}`;document.querySelectorAll('.dot').forEach((el,i)=>el.classList.toggle('active',i===current));$('prev').style.display=current===0?'none':'block';$('next').style.display=current===photos.length-1?'none':'block';}function move(n){current=(current+n+photos.length)%photos.length;update();restartMotion()}
function restartMotion(){const slide=$('track').children[current];if(!slide)return;slide.querySelectorAll('img,.copy > div,.copy .name,.copy .eyebrow,.copy .subtitle,.copy .bottom,.copy .venue').forEach(el=>{el.style.animation='none';void el.offsetWidth;el.style.animation='';});}
// Change this value to control automatic slide speed (milliseconds).

function resetAutoSlide(){clearInterval(autoSlideTimer);autoSlideTimer=setInterval(()=>{if(photos.length>1)move(1)},AUTO_SLIDE_MS)}$('prev').onclick=()=>{move(-1);resetAutoSlide()};$('next').onclick=()=>{move(1);resetAutoSlide()};let startX=null;$('visual').addEventListener('touchstart',e=>startX=e.touches[0].clientX,{passive:true});$('visual').addEventListener('touchend',e=>{if(startX===null)return;let dx=e.changedTouches[0].clientX-startX;if(Math.abs(dx)>45){move(dx<0?1:-1);resetAutoSlide()}startX=null},{passive:true});$('audio').src=MUSIC_URL;

// Instagram-style sound toggle inside the photo, no welcome screen.
const audioEl = $('audio');

const mutedIcon = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H3v6h3l5 4V5Z"/><path d="m17 9 5 6m0-6-5 6"/></svg>';
const unmutedIcon = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H3v6h3l5 4V5Z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M19 5a10 10 0 0 1 0 14"/></svg>';
function updateSoundButton() {
 const on = !audioEl.muted && !audioEl.paused;
 soundBtn.innerHTML = on ? unmutedIcon : mutedIcon;
 soundBtn.setAttribute('aria-label', on ? 'Mute music' : 'Unmute music');
 soundBtn.title = on ? 'Mute music' : 'Unmute music';
 soundBtn.setAttribute('aria-pressed', String(on));
}
updateSoundButton();

 if (!audioEl.muted && !audioEl.paused) {
   audioEl.muted = true;

function showHeartBurst(x,y){
  celebrationLayer.replaceChildren();
  clearTimeout(celebrationCleanup);
  const cx=Math.max(0,Math.min(window.innerWidth,x));

  celebrationCleanup=setTimeout(()=>celebrationLayer.replaceChildren(),2100);
}
