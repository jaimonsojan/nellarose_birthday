<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nella Rose | First Birthday</title><style>
*{box-sizing:border-box}body{margin:0;background:#111;color:#fafafa;font:14px Arial,sans-serif}.app{max-width:470px;margin:auto;background:#080808;min-height:100vh}.header{display:flex;align-items:center;gap:11px;padding:13px}.avatar{width:41px;height:41px;border-radius:50%;padding:2px;background:linear-gradient(35deg,#f7ba39,#ff237a,#7944dc)}.avatar img{width:100%;height:100%;object-fit:cover;border-radius:50%;border:2px solid #080808}.user{font-weight:700}.sub{font-size:11px;color:#aaa;margin-top:3px}.more{margin-left:auto;font-size:23px}.visual{position:relative;aspect-ratio:4/5;overflow:hidden;touch-action:pan-y;background:#34302c}.track{display:flex;width:100%;height:100%;transition:transform .45s cubic-bezier(.2,.75,.25,1)}.slide{position:relative;flex:0 0 100%;height:100%;overflow:hidden}.slide img{height:100%;width:100%;object-fit:cover;animation:zoom 14s ease-in-out infinite alternate}.slide:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,#140c1599,transparent 45%,#130d0eaa);pointer-events:none}.copy{position:absolute;z-index:2;inset:0;display:flex;flex-direction:column;justify-content:space-between;text-align:center;padding:9% 5% 8%;pointer-events:none;text-shadow:0 2px 12px #000a}.eyebrow{letter-spacing:3px;font-size:11px}.name{font:italic clamp(38px,10vw,58px) Georgia,serif;margin:8px 0}.subtitle{letter-spacing:4px;font-size:13px}.bottom{font-family:Georgia,serif;font-size:23px}.small{font:12px/1.9 Arial,sans-serif;letter-spacing:1.4px}.venue{font:italic 21px Georgia,serif;color:#ffe2db}.spark{position:absolute;z-index:3;color:#fff3df;animation:twinkle 2.8s infinite alternate;pointer-events:none}.spark.a{top:33%;left:10%}.spark.b{top:44%;right:12%;animation-delay:1s}.spark.c{bottom:24%;left:18%;animation-delay:1.8s}.counter{position:absolute;right:12px;top:12px;background:#252525aa;padding:7px 11px;border-radius:18px;z-index:5}.nav{position:absolute;top:45%;z-index:6;border:0;background:#0007;color:white;border-radius:50%;width:35px;height:35px;font-size:24px;cursor:pointer}.prev{left:8px}.next{right:8px}.actions{display:flex;align-items:center;gap:17px;padding:12px 13px 5px}.action{border:0;background:none;color:#fff;padding:0;cursor:pointer;display:flex}.action svg{width:27px;height:27px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}.action.liked{color:#ff365e}.action.liked svg{fill:currentColor}.save{margin-left:auto}.dots{display:flex;gap:5px;justify-content:center;flex:1}.dot{width:6px;height:6px;border-radius:50%;background:#777}.dot.active{background:#2c9eff}.likes{padding:5px 14px;font-weight:bold}.caption{padding:7px 14px 15px;line-height:1.65}.caption b{margin-right:5px}.muted{color:#aaa}.toolbar h3{margin:0 0 7px;font-size:15px}.toolbar p{margin:0 0 10px;color:#bbb;font-size:12px;line-height:1.5}.buttons{display:flex;flex-wrap:wrap;gap:8px}.btn{background:#252529;color:#fff;border:1px solid #555;border-radius:10px;padding:9px 12px;cursor:pointer;font-size:12px}.btn.primary{background:#9a3f58;border-color:#9a3f58}.file{display:none}.status{font-size:12px;color:#d6b3c0;margin-top:9px;min-height:16px}.music-control.playing{color:#ff7c9b}.music-control.playing svg{fill:#ff7c9b33}@keyframes zoom{from{transform:scale(1)}to{transform:scale(1.07)}}@keyframes twinkle{from{opacity:.2;transform:scale(.65) rotate(-10deg)}to{opacity:1;transform:scale(1.2) rotate(15deg)}}@media(prefers-reduced-motion:reduce){*,*:after{animation:none!important;transition:none!important}}

/* Enhanced motion: visible on every slide */
.slide img{animation:kenburns 7s ease-in-out infinite alternate;transform-origin:center center}
.slide .copy .eyebrow,.slide .copy .subtitle{animation:riseIn 1.1s both}
.slide .copy .name{animation:riseIn 1.2s .2s both,glow 3s 1.4s ease-in-out infinite alternate}
.slide .copy .bottom,.slide .copy .venue{animation:riseIn 1.1s .45s both}
.spark{font-size:27px;filter:drop-shadow(0 0 8px #fff);animation:twinkle 1.8s ease-in-out infinite alternate}
.spark.b{animation-delay:.6s}.spark.c{animation-delay:1.2s}
@keyframes kenburns{0%{transform:scale(1) translate(0,0)}100%{transform:scale(1.14) translate(-1.5%, -1%)}}
@keyframes riseIn{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:translateY(0)}}
@keyframes glow{from{text-shadow:0 2px 12px #000a}to{text-shadow:0 0 22px #ffe0d9,0 2px 12px #000a}}
/* Keep motion running even if system requests reduced motion: user explicitly requested animations */
@media(prefers-reduced-motion:reduce){.slide img,.slide .copy .name,.slide .copy .eyebrow,.slide .copy .subtitle,.slide .copy .bottom,.slide .copy .venue,.spark{animation-duration:7s!important;animation-iteration-count:infinite!important}}
</style></head><body><main class="app" id="app"><header class="header"><div class="avatar"><img id="avatar" src="baby.jpg" alt="Nella Rose"></div><div><div class="user">nella.rose ♡</div><div class="sub">First birthday invitation · 30 October</div></div><span class="more">···</span></header><section class="visual" id="visual" aria-label="Birthday photo carousel"><div class="track" id="track"></div><span class="counter" id="counter">1/1</span><button class="nav prev" id="prev" aria-label="Previous photo">‹</button><button class="nav next" id="next" aria-label="Next photo">›</button></section><div class="actions"><button class="action" id="like" aria-label="Like"><svg viewBox="0 0 24 24"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1.1-1.1a5.5 5.5 0 0 0-7.8 7.8L12 21l8.8-8.6a5.5 5.5 0 0 0 0-7.8Z"/></svg></button><button class="action" id="comment" aria-label="Comment"><svg viewBox="0 0 24 24"><path d="M21 11.5a8.5 8.5 0 0 1-8.5 8.5 9 9 0 0 1-4-.9L3 21l1.9-5.5a8.5 8.5 0 1 1 16.1-4Z"/></svg></button><button class="action" id="share" aria-label="Share"><svg viewBox="0 0 24 24"><path d="m22 2-7 20-4-9-9-4 20-7ZM22 2 11 13"/></svg></button><div class="dots" id="dots"></div><button class="action save" id="save" aria-label="Save"><svg viewBox="0 0 24 24"><path d="M5 3h14v18l-7-5-7 5V3Z"/></svg></button></div><div class="likes" id="likes">Loved by family & friends ♡</div><div class="caption"><b>nella.rose</b> Our little sunshine is turning ONE! 🎂✨ You're invited to celebrate Nella Rose's first birthday. 💗<div class="muted">Friday, 30 Oct 2026 · 7:00 PM · Calicut Notebook</div></div><audio id="audio" loop preload="none"></audio></main><script>
const $=id=>document.getElementById(id);// EDIT YOUR PHOTO AND MUSIC LINKS BELOW.
// Add up to 10 photo URLs. You may use relative paths such as "images/photo2.jpg"
// or complete HTTPS URLs. Keep images in the same order you want them displayed.
const PHOTO_URLS = [
  "https://res.cloudinary.com/f12l2g8t/image/upload/v1793034029/1.jpg",
  "https://res.cloudinary.com/f12l2g8t/image/upload/v1793034029/2.jpg",
  "https://res.cloudinary.com/f12l2g8t/image/upload/v1793034029/3.jpg",
  "https://res.cloudinary.com/f12l2g8t/image/upload/v1793034029/4.jpg",
  "https://res.cloudinary.com/f12l2g8t/image/upload/v1793034029/5.jpg",
  "https://res.cloudinary.com/f12l2g8t/image/upload/v1793034029/6.jpg",
  "https://res.cloudinary.com/f12l2g8t/image/upload/v1793034029/7.jpg",
  "https://res.cloudinary.com/f12l2g8t/image/upload/v1793034029/8.jpg",
  "https://res.cloudinary.com/f12l2g8t/image/upload/v1793034029/9.jpg",
  "https://res.cloudinary.com/f12l2g8t/image/upload/v1793034029/10.jpg"
];
const MUSIC_URL = "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3"; // e.g. "music/birthday.mp3" or "https://example.com/song.mp3"
const AVATAR_URL = PHOTO_URLS[0] || "baby.jpg";
let photos=PHOTO_URLS.slice(0,10),current=0;const escapeHtml=s=>s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function render(){if(!photos.length)photos=["baby.jpg"];const slides=photos.map((src,i)=>`<div class="slide"><img src="${escapeHtml(src)}" alt="Nella Rose birthday photo ${i+1}"><span class="spark a">✦</span><span class="spark b">✧</span><span class="spark c">♡</span>${i===0?`<div class="copy"><div><div class="eyebrow">YOU'RE INVITED TO</div><div class="name">Nella Rose</div><div class="subtitle">FIRST BIRTHDAY ♡</div></div><div><div class="bottom">30 October 2026</div><div class="small">FRIDAY · 07:00 PM</div><div class="venue">Calicut Notebook</div><div class="small">COME CELEBRATE ONE YEAR OF LOVE</div></div></div>`:`<div class="copy"><div><div class="eyebrow">OUR LITTLE SUNSHINE</div><div class="name">Nella Rose</div><div class="subtitle">TURNS ONE ♡</div></div><div><div class="small">30 OCT 2026 · 07:00 PM</div><div class="venue">Calicut Notebook</div></div></div>`}</div>`).join('');$('track').innerHTML=slides;$('dots').innerHTML=photos.map((_,i)=>`<span class="dot ${i===current?'active':''}"></span>`).join('');update();}function update(){current=Math.max(0,Math.min(current,photos.length-1));$('track').style.transform=`translateX(-${current*100}%)`;$('counter').textContent=`${current+1}/${photos.length}`;document.querySelectorAll('.dot').forEach((el,i)=>el.classList.toggle('active',i===current));$('prev').style.display=current===0?'none':'block';$('next').style.display=current===photos.length-1?'none':'block';}function move(n){current=(current+n+photos.length)%photos.length;update();restartMotion()}
function restartMotion(){const slide=$('track').children[current];if(!slide)return;slide.querySelectorAll('img,.copy > div,.copy .name,.copy .eyebrow,.copy .subtitle,.copy .bottom,.copy .venue').forEach(el=>{el.style.animation='none';void el.offsetWidth;el.style.animation='';});}
// Change this value to control automatic slide speed (milliseconds).
const AUTO_SLIDE_MS = 5500;
let autoSlideTimer=setInterval(()=>{if(photos.length>1)move(1)},AUTO_SLIDE_MS);
function resetAutoSlide(){clearInterval(autoSlideTimer);autoSlideTimer=setInterval(()=>{if(photos.length>1)move(1)},AUTO_SLIDE_MS)}$('prev').onclick=()=>{move(-1);resetAutoSlide()};$('next').onclick=()=>{move(1);resetAutoSlide()};let startX=null;$('visual').addEventListener('touchstart',e=>startX=e.touches[0].clientX,{passive:true});$('visual').addEventListener('touchend',e=>{if(startX===null)return;let dx=e.changedTouches[0].clientX-startX;if(Math.abs(dx)>45){move(dx<0?1:-1);resetAutoSlide()}startX=null},{passive:true});$('audio').src=MUSIC_URL;
$('avatar').src=AVATAR_URL;
// Browsers require a user gesture before music can start. Tap the music note to play.
const musicButton=document.createElement('button');
musicButton.className='action music-control';musicButton.id='musicToggle';
musicButton.setAttribute('aria-label','Play or pause music');
musicButton.title='Play / pause music';
musicButton.innerHTML='<svg viewBox="0 0 24 24"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>';
$('save').before(musicButton);
musicButton.onclick=async()=>{const a=$('audio');if(!MUSIC_URL){alert('Add a music URL in MUSIC_URL inside index.html first.');return}if(a.paused){try{await a.play();musicButton.classList.add('playing');musicButton.title='Pause music'}catch(e){alert('Unable to play audio. Check the music URL.')}}else{a.pause();musicButton.classList.remove('playing');musicButton.title='Play music'}};
$('like').onclick=()=>{$('like').classList.toggle('liked');$('likes').textContent=$('like').classList.contains('liked')?'Liked by you ❤️':'Loved by family & friends ♡'};$('save').onclick=()=>{$('save').style.color=$('save').style.color?'':'#fff';$('save').querySelector('svg').style.fill=$('save').querySelector('svg').style.fill?'':'#fff'};$('comment').onclick=()=>alert('We can’t wait to celebrate with you! 💗');$('share').onclick=async()=>{const data={title:'Nella Rose First Birthday',text:'You are invited! 30 October 2026, 7 PM at Calicut Notebook.'};if(navigator.share){try{await navigator.share(data)}catch(e){}}else{try{await navigator.clipboard.writeText(data.text);alert('Invitation details copied!')}catch(e){alert(data.text)}}};document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'){move(1);resetAutoSlide()}if(e.key==='ArrowLeft'){move(-1);resetAutoSlide()}});render();
</script></body></html>
